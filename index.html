<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halina IT – Sales pages for experts</title>
    <meta name="description" content="Halina IT creates sales landing pages for experts. Choose your language: Polish, English, or Ukrainian.">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#FF5C35">
    <link rel="icon" type="image/png" href="/images/icon.png">
    <link rel="apple-touch-icon" href="/images/icon.png">
    <link rel="canonical" href="https://halinait.com/en/">
    <link rel="alternate" hreflang="pl" href="https://halinait.com/pl/">
    <link rel="alternate" hreflang="uk" href="https://halinait.com/ua/">
    <link rel="alternate" hreflang="en" href="https://halinait.com/en/">
    <link rel="alternate" hreflang="x-default" href="https://halinait.com/en/">
    <script>
        (function () {
            var cookieMatch = document.cookie.match(/(?:^|;\s*)hit_lang=(ua|pl|en)\b/);
            if (cookieMatch) {
                window.location.replace('/' + cookieMatch[1] + '/');
                return;
            }

            var lang = (navigator.language || 'en').split('-')[0].toLowerCase();
            var target = 'en';

            if (lang === 'uk' || lang === 'ua') {
                target = 'ua';
            } else if (lang === 'pl') {
                target = 'pl';
            }

            window.location.replace('/' + target + '/');
        })();
    </script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #FFF5E6;
            margin: 0;
        }
        h1 {
            color: #1A1208;
            text-align: center;
            line-height: 1.6;
            font-size: 1.25rem;
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <h1>
        Redirecting to your language...<br>
        Перенаправлення на вашу мову...<br>
        Przekierowanie do Twojego języka...
    </h1>
</body>
</html>
